name: flutter-ci

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 版本固定：pubspec 要求 flutter >=3.27.0 / dart >=3.6.0。
          # 选 3.27.4 (dart 3.6.2)：与依赖集合（share_plus 10.1.4 /
          # package_info_plus 8.1.3 / flutter_lints 5.0.0）同代，且其格式化器为
          # 旧风格，避免 Dart 3.7+ tall-style 触发 dart format 校验失败。
          # 不要换回 floating stable，否则版本漂移会让构建不可复现。
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: bash tool/ci_prepare_android.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: heartrate-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
