name: ci

"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要；只作用于本仓库

env:
  FLUTTER_VERSION: '3.27.4'
  APP_VERSION: '0.1.0'

jobs:
  # ---------------------------------------------------------------- 质量关
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # ------------------------------------------------------- 平台工程存在性探测
  # 仓库目前只有 android/；ios/ 与 windows/ 工程补齐后，下面的 job 会自动启用，
  # 不需要再改本文件。探测失败时只是跳过对应 job，不影响 Android 出包。
  detect:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.d.outputs.ios }}
      windows: ${{ steps.d.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -d ios ] && echo "ios=true" >> "$GITHUB_OUTPUT" || echo "ios=false" >> "$GITHUB_OUTPUT"
          [ -d windows ] && echo "windows=true" >> "$GITHUB_OUTPUT" || echo "windows=false" >> "$GITHUB_OUTPUT"
          echo "ios dir: $([ -d ios ] && echo yes || echo no) / windows dir: $([ -d windows ] && echo yes || echo no)"

  # ------------------------------------------------------------- Android 分包
  # release + --split-per-abi：每个 ABI 一个 APK，避免 4 套 so 挤在一个包里。
  # 未配置正式 keystore 时 Flutter 用 debug 签名 —— 可装机测试，不可上架。
  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: bash tool/ci_prepare_android.sh
      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi
      - name: Rename with version + ABI
        run: |
          mkdir -p out
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "out/heartrate-${APP_VERSION}-${abi}-release.apk"
          done
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- Windows 桌面
  windows:
    needs: [quality, detect]
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip (免安装)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "heartrate-${env:APP_VERSION}-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          path: heartrate-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------- iOS 编译
  # 无 Apple 开发者账号时只能证明「编得过」，产物是未签名 .app，装不上真机，
  # 因此不发布到 Release，只留 artifact 备查。
  ios:
    needs: [quality, detect]
    if: needs.detect.outputs.ios == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock', '**/pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

  # ------------------------------------------------------- 发布到 GitHub Release
  release:
    needs: [android, windows, ios]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-release-*
          path: assets
          merge-multiple: true
      # 若将来补齐 windows/ 并构建成功，一并作为资产上传
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true
      - name: Show assets
        run: ls -lh assets/
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "共享心率 $TAG" --generate-notes \
                 --notes "Android release APK（按 ABI 分包，debug 签名，仅供真机测试，不可上架）。"
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | .name + "  " + (.size|tostring) + " bytes"'
