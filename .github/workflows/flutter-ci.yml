name: ci

"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要；只作用于本仓库

env:
  FLUTTER_VERSION: '3.47.8'
  # 版本号不再写死：从 pubspec.yaml 的 `version:` 派生，
  # 否则每次升版都会出现「Release 版本号与资产名不一致」的漂移。

jobs:
  # ---------------------------------------------------------------- 质量关
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # ------------------------------------------------------- 平台工程存在性探测
  # 仓库目前只有 android/；ios/ 与 windows/ 工程补齐后，下面的 job 会自动启用，
  # 不需要再改本文件。探测失败时只是跳过对应 job，不影响 Android 出包。
  detect:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.d.outputs.ios }}
      windows: ${{ steps.d.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -d ios ] && echo "ios=true" >> "$GITHUB_OUTPUT" || echo "ios=false" >> "$GITHUB_OUTPUT"
          [ -d windows ] && echo "windows=true" >> "$GITHUB_OUTPUT" || echo "windows=false" >> "$GITHUB_OUTPUT"
          echo "ios dir: $([ -d ios ] && echo yes || echo no) / windows dir: $([ -d windows ] && echo yes || echo no)"

  # ------------------------------------------------------------- Android 分包
  # release + --split-per-abi：每个 ABI 一个 APK，避免 4 套 so 挤在一个包里。
  # 未配置正式 keystore 时 Flutter 用 debug 签名 —— 可装机测试，不可上架。
  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          # Flutter 3.47.8 + Gradle 9.3.1 needs more headroom on the 14 GB runner.
          # Keep JDK/Android SDK/NDK; remove unrelated preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 必须用 17，不能用 21：AGP 8.1.0（Flutter 3.27.4 官方模板版本）在
          # JDK 21 下做 JdkImageTransform 时 jlink 会失败，报
          # "Failed to transform core-for-system-modules.jar"，
          # 只在 release 变体编译插件 Java 时触发（debug 不会）。
          # 升级到 AGP>=8.2.1 也可以，但会牵动 Gradle 版本，故优先对齐 JDK。
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: bash tool/ci_prepare_android.sh
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 固定 release keystore：跨版本覆盖安装的前提。
          # 明文只落在 runner 临时目录与 gitignore 的 key.properties，构建后即删。
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          cat > android/key.properties <<EOF
          storeFile=$KS
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/key.properties
          echo "keystore decoded: $(stat -c%s "$KS") bytes"
      # 只出 arm64-v8a：另外两个 ABI 已停用（用户明确只要 v8a，省时长省体积）
      - name: Build arm64-v8a release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Print APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          APK=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "--- 签名证书（SHA-256 指纹应与基线一致，否则说明签名材料变了）---"
          "$APKSIGNER" verify --print-certs "$APK" | head -8
      - name: Resolve app version from pubspec
        id: ver
        run: |
          v=$(sed -n 's/^version: *\([0-9A-Za-z.\-]*\)+.*/\1/p' pubspec.yaml)
          [ -n "$v" ] || { echo "cannot parse version from pubspec.yaml"; exit 1; }
          echo "resolved=$v" >> "$GITHUB_OUTPUT"
          echo "app version: $v"
      - name: Rename with version + ABI
        env:
          APP_VERSION: ${{ steps.ver.outputs.resolved }}
        run: |
          mkdir -p out
          # 只保留 arm64-v8a 一个资产
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "out/heartrate-${APP_VERSION}-arm64-v8a-release.apk"
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" android/key.properties
          echo "signing material removed"


  # ------------------------------------------------------------- Windows 桌面
  windows:
    needs: [quality, detect]
    if: needs.detect.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Sync Runner.rc version from pubspec
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)\+').Matches.Groups[1].Value
          $rc = 'windows/runner/Runner.rc'
          (Get-Content $rc) -replace 'VERSION_AS_STRING "[0-9.]+"', "VERSION_AS_STRING `"$ver`"" |
            Set-Content $rc -Encoding UTF8
          Write-Host "Runner.rc version -> $ver"
      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          # 不打包 CRT 的话，没装过 VC++ 2015-2022 运行库的机器会"双击秒退"（loader 失败，
          # 连我们的 startup.log 都进不去）。运行时 DLL 是允许随程序分发的。
          $dest = 'build/windows/x64/runner/Release'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath
            $crt = Get-ChildItem -Path "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($crt) {
              Copy-Item "$($crt.FullName)\*.dll" $dest -Force
              Write-Host "copied CRT from $($crt.FullName)"
            } else { Write-Warning 'CRT redist not found' }
          } else { Write-Warning 'vswhere not found' }
          Get-ChildItem $dest -Filter *.dll | Select-Object Name
          $wm = Get-ChildItem $dest -Filter 'window_manager_plugin.dll' -ErrorAction SilentlyContinue
          if ($wm) { throw 'window_manager_plugin.dll 仍在产物里（插件没删干净）' }
          Write-Host 'DLL 清单（不应包含 window_manager_plugin.dll）：'
          (Get-ChildItem $dest -Filter *.dll | Select-Object -ExpandProperty Name) -join ', '
      - name: Resolve app version from pubspec
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's/^version: *\([0-9A-Za-z.\-]*\)+.*/\1/p' pubspec.yaml)
          [ -n "$v" ] || { echo "cannot parse version"; exit 1; }
          echo "resolved=$v" >> "$GITHUB_OUTPUT"
      # 单文件 exe：自写 loader（windows/loader/loader.cpp）+ 追加 zip 载荷 + 32 字节页脚。
      # 为什么不用 7-Zip SFX：实测 RunProgram 不执行（用户要在解压目录里自己找 exe）。
      - name: Build single-file exe (custom loader)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.resolved }}'
          $stage = 'build/win-stage'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'build/windows/x64/runner/Release/*' $stage -Recurse -Force
          Copy-Item docs/win-run.txt "$stage/README.txt" -Force

          # 载荷：在 stage 目录里打包，条目是根级（否则会多一层 build/win-stage）
          $payload = Join-Path (Get-Location).Path 'payload.zip'
          Remove-Item $payload -Force -ErrorAction SilentlyContinue
          Push-Location $stage
          Compress-Archive -Path * -DestinationPath $payload -CompressionLevel Optimal
          Pop-Location
          if (-not (Test-Path $payload)) { throw 'payload.zip not produced' }

          # 编译 loader：静态 CRT（/MT，不依赖系统运行库）、无控制台（/SUBSYSTEM:WINDOWS）
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere not found' }
          $vs = & $vswhere -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Remove-Item loader.exe -Force -ErrorAction SilentlyContinue
          cmd /c "call `"$vcvars`" >nul && cl /nologo /O2 /MT /EHsc /utf-8 /DUNICODE /D_UNICODE windows\loader\loader.cpp /Fe:loader.exe /link /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup user32.lib"
          if (-not (Test-Path 'loader.exe')) { throw 'loader.exe not produced' }
          Write-Host "loader.exe built: $((Get-Item loader.exe).Length) bytes"

          # 拼接：loader + payload + 页脚(magic/offset/size)
          $loaderBytes = [IO.File]::ReadAllBytes((Resolve-Path 'loader.exe'))
          $payloadBytes = [IO.File]::ReadAllBytes($payload)
          $footer = New-Object byte[] 32
          [Text.Encoding]::ASCII.GetBytes('HRSLD001').CopyTo($footer, 0)
          [BitConverter]::GetBytes([uint64]$loaderBytes.Length).CopyTo($footer, 8)
          [BitConverter]::GetBytes([uint64]$payloadBytes.Length).CopyTo($footer, 16)
          $out = "heartrate-$ver-windows-x64.exe"
          $fs = [IO.File]::Create($out)
          $fs.Write($loaderBytes, 0, $loaderBytes.Length)
          $fs.Write($payloadBytes, 0, $payloadBytes.Length)
          $fs.Write($footer, 0, 32)
          $fs.Close()
          Get-Item $out | Select-Object Name, Length
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $out))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'not a PE file' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          path: heartrate-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      # 启动冒烟门禁：这次真的跑**单文件 exe**（中文+空格路径），三种模式各跑一遍。
      - name: Startup smoke (single-file exe, Chinese path, 3 modes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.resolved }}'
          $exe = (Resolve-Path "heartrate-$ver-windows-x64.exe").Path
          # 中文 + 空格路径（用户机器就是 D:\默认下载）
          $cnDir = Join-Path $env:SystemDrive '默认下载 冒烟'
          Remove-Item $cnDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $cnDir | Out-Null
          $runPath = Join-Path $cnDir (Split-Path $exe -Leaf)
          Copy-Item $exe $runPath -Force
          Write-Host "run from: $runPath"

          $logDir = Join-Path $env:LOCALAPPDATA 'heartrate\logs'
          $appRoot = Join-Path $env:LOCALAPPDATA 'heartrate\app'

          function Try-Mode([string]$name, [string]$expect) {
            Write-Host "=== mode: $name ==="
            Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
            Get-Process heartrate -ErrorAction SilentlyContinue | Stop-Process -Force
            # 用环境变量而不是命令行参数：7z SFX 是否把参数透传给 RunProgram 不确定，
            # 环境变量子进程一定会继承。
            Remove-Item Env:HEARTRATE_SAFE_MODE -ErrorAction SilentlyContinue
            Remove-Item Env:HEARTRATE_OPAQUE -ErrorAction SilentlyContinue
            if ($name -eq 'safe-mode') { $env:HEARTRATE_SAFE_MODE = '1' }
            if ($name -eq 'opaque') { $env:HEARTRATE_OPAQUE = '1' }
            Start-Process -FilePath $runPath | Out-Null
            $proc = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $proc = Get-Process -Name heartrate -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($proc) { break }
            }
            if (-not $proc) { throw "[$name] 单文件 exe 没有拉起 heartrate.exe" }
            Start-Sleep -Seconds 8
            $again = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if (-not $again) { throw "[$name] heartrate.exe 在 8 秒内退出" }
            # 解压布局：exe 必须在根级（不能多一层 build/win-stage），且没有 window_manager
            $appDir = Get-ChildItem $appRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'heartrate.exe') } |
              Select-Object -First 1
            if (-not $appDir) { throw "[$name] 解压目录里没有根级 heartrate.exe（$appRoot）" }
            if (Test-Path (Join-Path $appDir.FullName 'build')) {
              throw "[$name] 解压多了一层 build 目录（打包时带了前缀）"
            }
            if (Test-Path (Join-Path $appDir.FullName 'window_manager_plugin.dll')) {
              throw "[$name] 解压目录里仍有 window_manager_plugin.dll"
            }
            $log = Join-Path $logDir 'startup.log'
            if (-not (Test-Path $log)) { throw "[$name] 没有 startup.log" }
            Get-Content $log | ForEach-Object { Write-Host $_ }
            if (-not (Select-String -Path $log -Pattern 'stage: window shown' -Quiet)) {
              throw "[$name] 日志没有走到 stage: window shown"
            }
            if (-not (Select-String -Path $log -SimpleMatch $expect -Quiet)) {
              throw "[$name] 日志里没有预期的 '$expect'（模式没生效？）"
            }
            # 编码自检：日志必须能按 UTF-8 严格解码，且没有替换符/典型 mojibake
            $raw = [IO.File]::ReadAllText($log, [Text.Encoding]::UTF8)
            if ($raw.Contains([char]0xFFFD)) { throw "[$name] 日志里有 U+FFFD（编码坏了）" }
            foreach ($bad in @('å', 'äº', 'æ', 'ç')) {
              if ($raw.Contains($bad)) { throw "[$name] 日志里有 mojibake 片段 '$bad'" }
            }
            if (Test-Path (Join-Path $logDir 'crash.log')) {
              Get-Content (Join-Path $logDir 'crash.log') | ForEach-Object { Write-Host $_ }
              throw "[$name] 出现 crash.log"
            }
            Stop-Process -Id $proc.Id -Force
            Write-Host "[$name] OK"
          }

          Try-Mode 'normal' 'mode: safe=0 opaque=0'
          Try-Mode 'safe-mode' 'mode: safe=1 opaque=0'
          Try-Mode 'opaque' 'mode: safe=0 opaque=1'
          Write-Host 'single-file smoke OK (3 modes, Chinese path)'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-log-${{ github.sha }}
          path: ${{ env.LOCALAPPDATA }}\heartrate\logs\*
          if-no-files-found: warn
          retention-days: 14


  # ----------------------------------------------------------------- iOS 编译
  # 无 Apple 开发者账号时只能证明「编得过」，产物是未签名 .app，装不上真机，
  # 因此不发布到 Release，只留 artifact 备查。
  ios:
    needs: [quality, detect]
    if: needs.detect.outputs.ios == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock', '**/pubspec.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

  # ------------------------------------------------------- 发布到 GitHub Release
  release:
    needs: [android, windows, ios]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-release-*
          path: assets
          merge-multiple: true
      # 若将来补齐 windows/ 并构建成功，一并作为资产上传
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true
      - name: Unwrap windows artifact (artifact 是 zip 套 zip)
        run: |
          set -euo pipefail
          for z in assets/windows-*.zip; do
            [ -e "$z" ] || continue
            echo "unwrapping $z"
            unzip -o -q "$z" -d assets/
            rm -f "$z"
          done
          ls -lh assets/

      - name: Show assets
        run: ls -lh assets/
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "共享心率 $TAG" --generate-notes \
                 --notes "Android APK（按 ABI 分包，可覆盖安装）与 Windows 免安装 zip（解压后双击 heartrate.exe；详见包内 README.txt）。"
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | .name + "  " + (.size|tostring) + " bytes"'
