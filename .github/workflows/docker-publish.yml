name: docker-publish

"on":
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/docker-publish.yml'
    # 注意：GitHub 对 tag 推送不套用 paths 过滤，所以打 v* tag 一定会触发
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read   # 只构建推送镜像，不需要写仓库

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: mawjgit/heart-rate-share

jobs:
  build-smoke-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tags="$IMAGE:sha-$short"
          # latest 只给默认分支，避免 tag 构建把 latest 顶掉
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          # 打 tag 时追加版本号（如 v0.2.0）
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags,$IMAGE:${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "list=$tags" >> "$GITHUB_OUTPUT"
          echo "primary=$IMAGE:sha-$short" >> "$GITHUB_OUTPUT"
          echo "computed tags: $tags"

      - uses: docker/setup-buildx-action@v3

      # 先只构建并载入本地 docker，不推送 —— 冒烟不通过就绝不推
      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /healthz before pushing
        run: |
          set -euo pipefail
          img="${{ steps.tags.outputs.primary }}"
          docker run -d --name relay-smoke -p 18765:8765 -e PORT=8765 "$img"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18765/healthz -o /tmp/healthz.json; then break; fi
            sleep 1
          done
          echo "--- /healthz ---"; cat /tmp/healthz.json; echo
          node -e "const d=require('/tmp/healthz.json'); if(d.status!=='ok'){console.error('healthz not ok');process.exit(1)}; console.log('healthz ok, protocol='+d.protocol+' rooms='+d.rooms)"
          echo "--- 容器健康状态 ---"
          docker inspect --format '{{.State.Health.Status}}' relay-smoke || true
          echo "--- 容器日志（末 5 行）---"
          docker logs --tail 5 relay-smoke
          docker rm -f relay-smoke

      # 冒烟通过后才登录并推送
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push all tags
        run: |
          set -euo pipefail
          IFS=',' read -ra list <<< "${{ steps.tags.outputs.list }}"
          for t in "${list[@]}"; do
            echo "pushing $t"
            docker push "$t"
          done

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Docker 镜像"
            echo '```'
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
            docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}}  {{.Size}}' || true
          } >> "$GITHUB_STEP_SUMMARY"
