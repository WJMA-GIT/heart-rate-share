name: windows-preview-smoke

# Windows 目录的界面冒烟（线 B）。
# --connected-preview 注入 mock 成员并强制「已连接」，断言：
#   1) startup.log 里 full -> compact 与 compact -> full 两种切换都出现过；
#   2) 进程全程存活、窗口带 WS_THICKFRAME（拖边框能缩放），且能回到完整界面尺寸（>=720x480）；
#   3) startup.log 是千字节级（不是每帧刷栈的兆字节级），且没有 FlutterError。
"on":
  push:
    # 分支模型收敛为三支后，Windows 的活直接提交到 windows（不再开临时分支）。
    branches: [main, windows]
    paths:
      - 'windows/**'
      - 'native/windows/**'
      - 'lib/ui/win/**'
      - 'lib/main.dart'
      - '.github/workflows/windows-preview-smoke.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'native/windows/**'
      - 'lib/ui/win/**'
      - 'lib/main.dart'
      - '.github/workflows/windows-preview-smoke.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  windows-preview-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 这条线自己把格式关掉：ci 的 quality 只在 main/PR 上跑，分支上没人拦，
      # 合进去才发现 dart format 红过一次（tall style 会把手写换行合并回去）。
      - name: Format gate (lib/win)
        shell: bash
        run: |
          if dart format --output=none --set-exit-if-changed lib/ui/win; then
            exit 0
          fi
          echo "::error::dart format 不一致，下面 diff 就是该怎么改"
          dart format lib/ui/win >/dev/null
          git --no-pager diff -- lib/ui/win || true
          exit 1
      # 分支上主 ci 的 quality 要等合并后才跑；这里把 analyze 也钉住，
      # 让 Windows 线自己在推到 windows 分支时就能发现 Dart 侧问题。
      - name: Analyze
        run: flutter analyze
      - name: Build (release)
        shell: bash
        run: flutter build windows --release --dart-define=BUILD_ID=${GITHUB_SHA:0:8}
      - name: Preview smoke (--connected-preview)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/windows/x64/runner/Release/heartrate.exe').Path
          $logDir = Join-Path $env:LOCALAPPDATA 'heartrate\logs'
          $log = Join-Path $logDir 'startup.log'
          # 干净起点：日志和上次的窗口几何都清掉，否则可能命中缓存直接"看起来通过"
          Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA 'heartrate\window.state') -Force -ErrorAction SilentlyContinue
          Get-Process heartrate -ErrorAction SilentlyContinue | Stop-Process -Force

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class HrsWin {
            public delegate bool EnumProc(IntPtr hwnd, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc callback, IntPtr lparam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr hwnd, int index);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr hwnd, System.Text.StringBuilder name, int max);
            public static IntPtr ByClass(uint pid, string klass) {
              IntPtr found = IntPtr.Zero;
              EnumWindows(delegate(IntPtr hwnd, IntPtr lparam) {
                uint owner;
                GetWindowThreadProcessId(hwnd, out owner);
                if (owner != pid) return true;
                var sb = new System.Text.StringBuilder(256);
                GetClassName(hwnd, sb, 256);
                if (sb.ToString() == klass) {
                  found = hwnd;
                  return false;
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr hwnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hwnd, IntPtr after, int x, int y, int cx, int cy, uint flags);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hwnd, int cmd);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wparam, IntPtr lparam);
            public delegate bool EnumChildProc(IntPtr hwnd, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, EnumChildProc callback, IntPtr lparam);
            // Flutter 的视图窗口盖满客户区，真实鼠标命中问的是它（不是顶层窗口）。
            public static IntPtr FirstChild(IntPtr parent) {
              IntPtr found = IntPtr.Zero;
              EnumChildWindows(parent, delegate(IntPtr hwnd, IntPtr lparam) {
                found = hwnd;
                return false;
              }, IntPtr.Zero);
              return found;
            }
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static IntPtr Main(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows(delegate(IntPtr hwnd, IntPtr lparam) {
                uint owner;
                GetWindowThreadProcessId(hwnd, out owner);
                if (owner == pid && (GetWindowLong(hwnd, -16) & 0x10000000) != 0) {
                  found = hwnd;
                  return false;
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          "@

          $proc = Start-Process -FilePath $exe -ArgumentList '--connected-preview' -PassThru
          Write-Host "started pid=$($proc.Id)"

          function Read-LogText([string]$path) {
            if (-not (Test-Path $path)) { return '' }
            try { return (Get-Content $path -Raw) } catch { return '' }
          }

          # 1) 等两个窗口都出现（主窗口第一帧后显示；悬浮窗由 Dart 在"已连接"时打开）
          $main = [IntPtr]::Zero
          $overlay = [IntPtr]::Zero
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Milliseconds 250
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
              throw 'heartrate.exe 在冒烟过程中退出了'
            }
            if ($main -eq [IntPtr]::Zero) {
              $main = [HrsWin]::ByClass([uint32]$proc.Id, 'FLUTTER_RUNNER_WIN32_WINDOW')
            }
            if ($overlay -eq [IntPtr]::Zero) {
              $overlay = [HrsWin]::ByClass([uint32]$proc.Id, 'HRS_OVERLAY_WINDOW')
            }
            if ($main -ne [IntPtr]::Zero -and $overlay -ne [IntPtr]::Zero) { break }
          }
          if ($main -eq [IntPtr]::Zero) { throw '找不到主窗口（FLUTTER_RUNNER_WIN32_WINDOW）' }
          if ($overlay -eq [IntPtr]::Zero) { throw '找不到悬浮窗（HRS_OVERLAY_WINDOW）' }
          Write-Host "main hwnd = $main, overlay hwnd = $overlay"

          # 2) 主窗口必须是标准系统窗口：有标题栏/边框，不置顶、不分层、不穿透；悬浮窗反过来。
          $GWL_STYLE = -16
          $GWL_EXSTYLE = -20
          $WS_CAPTION = 0x00C00000
          $WS_THICKFRAME = 0x00040000
          $WS_EX_TOPMOST = 0x8
          $WS_EX_TRANSPARENT = 0x20
          $WS_EX_LAYERED = 0x80000
          $mainStyle = [HrsWin]::GetWindowLong($main, $GWL_STYLE)
          $mainEx = [HrsWin]::GetWindowLong($main, $GWL_EXSTYLE)
          $overlayEx = [HrsWin]::GetWindowLong($overlay, $GWL_EXSTYLE)
          Write-Host ("main GWL_STYLE = 0x{0:X}" -f $mainStyle)
          Write-Host ("main GWL_EXSTYLE = 0x{0:X}" -f $mainEx)
          Write-Host ("overlay GWL_EXSTYLE = 0x{0:X}" -f $overlayEx)
          if (($mainStyle -band $WS_CAPTION) -eq 0) { throw '主窗口没有 WS_CAPTION（应为标准系统窗口）' }
          if (($mainStyle -band $WS_THICKFRAME) -eq 0) { throw '主窗口没有 WS_THICKFRAME（应可拖边缩放）' }
          $bad = $mainEx -band ($WS_EX_TOPMOST -bor $WS_EX_LAYERED -bor $WS_EX_TRANSPARENT)
          if ($bad -ne 0) { throw ("主窗口不该有 TOPMOST/LAYERED/TRANSPARENT，实际 0x{0:X}" -f $mainEx) }
          if (($overlayEx -band $WS_EX_LAYERED) -eq 0) { throw '悬浮窗缺少 WS_EX_LAYERED' }
          if (($overlayEx -band $WS_EX_TOPMOST) -eq 0) { throw '悬浮窗缺少 WS_EX_TOPMOST' }
          Write-Host 'styles OK: main caption+thickframe/not topmost/layered, overlay layered+topmost'

          # 3) 视图 == 客户区（标准窗口天然成立，日志里也自证过）
          function Assert-ViewFillsClient([IntPtr]$win, [string]$tag, [bool]$checkChild) {
            for ($k = 0; $k -lt 8; $k++) {
              $c = New-Object HrsWin+RECT
              [void][HrsWin]::GetClientRect($win, [ref]$c)
              $cw = $c.Right - $c.Left
              $ch = $c.Bottom - $c.Top
              if ($checkChild) {
                $child = [HrsWin]::FirstChild($win)
                $cr = New-Object HrsWin+RECT
                [void][HrsWin]::GetWindowRect($child, [ref]$cr)
                $vw = $cr.Right - $cr.Left
                $vh = $cr.Bottom - $cr.Top
              } else {
                $wr = New-Object HrsWin+RECT
                [void][HrsWin]::GetWindowRect($win, [ref]$wr)
                $vw = $wr.Right - $wr.Left
                $vh = $wr.Bottom - $wr.Top
              }
              if ($cw -eq $vw -and $ch -eq $vh -and $cw -gt 0) {
                Write-Host "view/client [$tag]: client=${cw}x${ch} content=${vw}x${vh} OK"
                return
              }
              Start-Sleep -Milliseconds 250
            }
            throw "内容没铺满客户区 [$tag]：client=${cw}x${ch} content=${vw}x${vh}"
          }

          $text = Read-LogText $log
          # 失败时也能看到现场：先把日志整份打出来。
          Get-Content $log | ForEach-Object { Write-Host $_ }
          if ($text -notmatch 'window: style caption=1 thickframe=1 layered=0 topmost=0 transparent=0') {
            throw '启动日志里没有 window: style caption=1 ... 这行（主窗口不是标准窗口）'
          }
          if ($text -notmatch 'view==client OK') { throw '启动日志里没有 view==client OK' }
          Assert-ViewFillsClient $main 'main' $true
          Assert-ViewFillsClient $overlay 'overlay' $false
          if ($text -notmatch 'overlay: shown') { throw '日志里没有 overlay: shown（连接后悬浮窗没显示）' }
          if ($text -notmatch 'mode safe=0 opaque=0 preview=1') { throw 'preview 开关没生效' }
          Write-Host 'log OK: window style / view==client / overlay: shown'

          # 截图（PrintWindow 抓 DWM 合成结果，中文字体由系统 YaHei 提供）
          Add-Type -AssemblyName System.Drawing
          function Save-Shot([IntPtr]$h, [string]$path) {
            $r = New-Object HrsWin+RECT
            [void][HrsWin]::GetWindowRect($h, [ref]$r)
            $w = $r.Right - $r.Left
            $hh = $r.Bottom - $r.Top
            $bmp = New-Object System.Drawing.Bitmap($w, $hh)
            $graphics = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $graphics.GetHdc()
            [void][HrsWin]::PrintWindow($h, $hdc, 2)
            $graphics.ReleaseHdc($hdc)
            $graphics.Dispose()
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "shot saved: $path ($w x $hh)"
          }
          Save-Shot $main 'ui-main-connected.png'
          Save-Shot $overlay 'ui-overlay.png'

          # 5) 点悬浮窗上的「断开」图标（右侧 24 DIP），断言回未连接 + 悬浮窗隐藏
          $or = New-Object HrsWin+RECT
          [void][HrsWin]::GetWindowRect($overlay, [ref]$or)
          $btnX = ($or.Right - $or.Left) - 20
          $btnY = 18
          Write-Host "click overlay disconnect at ($btnX,$btnY)"
          $lp = [IntPtr](($btnY -shl 16) -bor ($btnX -band 0xFFFF))
          [void][HrsWin]::SendMessage($overlay, 0x0201, [IntPtr]1, $lp)
          Start-Sleep -Milliseconds 120
          [void][HrsWin]::SendMessage($overlay, 0x0202, [IntPtr]0, $lp)
          $clicked = $false
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.Elapsed.TotalSeconds -lt 5) {
            Start-Sleep -Milliseconds 150
            $text = Read-LogText $log
            if ($text -match 'overlay: hidden') { $clicked = $true; break }
          }
          if (-not $clicked) { throw '点了悬浮窗「断开」后悬浮窗没有隐藏（overlay: hidden 没出现）' }
          if ($text -notmatch 'overlay: disconnect from overlay window') {
            throw '断开点击没有传到 Dart（缺 overlay: disconnect from overlay window）'
          }
          Write-Host 'log OK: overlay: hidden + Dart 收到 overlayDisconnect'

          $size = (Get-Item $log).Length
          Write-Host "startup.log size = $size bytes"
          if ($text -match 'FlutterError|Null check operator') {
            throw '日志里出现 Flutter 错误'
          }

          Get-Process -Id $proc.Id | Stop-Process -Force
          Write-Host 'preview smoke OK'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-ui-shots
          path: ui-*.png
          if-no-files-found: warn
          retention-days: 14
