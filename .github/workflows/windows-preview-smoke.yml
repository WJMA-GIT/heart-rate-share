name: windows-preview-smoke

# Windows 目录的界面冒烟（线 B）。
# --connected-preview 注入 mock 成员并强制「已连接」，断言：
#   1) startup.log 里 full -> compact 与 compact -> full 两种切换都出现过；
#   2) 进程全程存活、窗口带 WS_THICKFRAME（拖边框能缩放），且能回到完整界面尺寸（>=720x480）；
#   3) startup.log 是千字节级（不是每帧刷栈的兆字节级），且没有 FlutterError。
"on":
  push:
    # 分支模型收敛为三支后，Windows 的活直接提交到 windows（不再开临时分支）。
    branches: [main, windows]
    paths:
      - 'windows/**'
      - 'native/windows/**'
      - 'lib/ui/win/**'
      - 'lib/main.dart'
      - '.github/workflows/windows-preview-smoke.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'native/windows/**'
      - 'lib/ui/win/**'
      - 'lib/main.dart'
      - '.github/workflows/windows-preview-smoke.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  windows-preview-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 这条线自己把格式关掉：ci 的 quality 只在 main/PR 上跑，分支上没人拦，
      # 合进去才发现 dart format 红过一次（tall style 会把手写换行合并回去）。
      - name: Format gate (lib/win)
        shell: bash
        run: |
          if dart format --output=none --set-exit-if-changed lib/ui/win; then
            exit 0
          fi
          echo "::error::dart format 不一致，下面 diff 就是该怎么改"
          diff -u lib/ui/win/win_app.dart \
            <(dart format --output=show lib/ui/win/win_app.dart) || true
          exit 1
      # 分支上主 ci 的 quality 要等合并后才跑；这里把 analyze 也钉住，
      # 让 Windows 线自己在推到 windows 分支时就能发现 Dart 侧问题。
      - name: Analyze
        run: flutter analyze
      - name: Build (release)
        run: flutter build windows --release
      - name: Preview smoke (--connected-preview)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build/windows/x64/runner/Release/heartrate.exe').Path
          $logDir = Join-Path $env:LOCALAPPDATA 'heartrate\logs'
          $log = Join-Path $logDir 'startup.log'
          # 干净起点：日志和上次的窗口几何都清掉，否则可能命中缓存直接"看起来通过"
          Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA 'heartrate\window.state') -Force -ErrorAction SilentlyContinue
          Get-Process heartrate -ErrorAction SilentlyContinue | Stop-Process -Force

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class HrsWin {
            public delegate bool EnumProc(IntPtr hwnd, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc callback, IntPtr lparam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr hwnd, int index);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wparam, IntPtr lparam);
            public delegate bool EnumChildProc(IntPtr hwnd, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent, EnumChildProc callback, IntPtr lparam);
            // Flutter 的视图窗口盖满客户区，真实鼠标命中问的是它（不是顶层窗口）。
            public static IntPtr FirstChild(IntPtr parent) {
              IntPtr found = IntPtr.Zero;
              EnumChildWindows(parent, delegate(IntPtr hwnd, IntPtr lparam) {
                found = hwnd;
                return false;
              }, IntPtr.Zero);
              return found;
            }
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static IntPtr Main(uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows(delegate(IntPtr hwnd, IntPtr lparam) {
                uint owner;
                GetWindowThreadProcessId(hwnd, out owner);
                if (owner == pid && (GetWindowLong(hwnd, -16) & 0x10000000) != 0) {
                  found = hwnd;
                  return false;
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          "@

          $proc = Start-Process -FilePath $exe -ArgumentList '--connected-preview' -PassThru
          Write-Host "started pid=$($proc.Id)"

          # 日志是按行 flush 的，读的时候可能刚好读到半行：轮询 + 收尾再读一次，
          # 不靠 sleep 猜时序。预览每 6 秒翻一次连接状态，45 秒够跑 3~4 轮。
          function Read-LogText([string]$path) {
            if (-not (Test-Path $path)) { return '' }
            try { return (Get-Content $path -Raw) } catch { return '' }
          }

          $deadline = (Get-Date).AddSeconds(45)
          $text = ''
          do {
            Start-Sleep -Milliseconds 500
            if (-not (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)) {
              throw 'heartrate.exe 在冒烟过程中退出了'
            }
            $text = Read-LogText $log
          } while ((Get-Date) -lt $deadline -and
                   -not ($text -match 'ui_mode: full -> compact' -and
                         $text -match 'ui_mode: compact -> full'))

          # 最后一行可能在上一轮读取之后才落盘：再等 1 秒重读一次再判定。
          Start-Sleep -Seconds 1
          $text = Read-LogText $log
          if (-not (Test-Path $log)) { throw '没有生成 startup.log' }
          Get-Content $log | ForEach-Object { Write-Host $_ }

          if ($text -notmatch 'ui_mode: full -> compact') { throw '日志里没有 ui_mode: full -> compact（连上后没进精简态）' }
          if ($text -notmatch 'ui_mode: compact -> full') { throw '日志里没有 ui_mode: compact -> full（断开后没回完整界面）' }
          if ($text -match 'FlutterError|Null check operator') { throw '日志里出现 Flutter 错误（渲染/布局异常）' }
          if ($text -notmatch 'preview: connected-preview on') { throw '预览开关没生效（Dart 侧没收到 --connected-preview）' }
          # 原生侧把命令行开关翻译成环境变量这一步，单独断言：失败时一眼能定位是哪一侧。
          if ($text -notmatch 'mode safe=0 opaque=0 preview=1') { throw '命令行 --connected-preview 没有被翻译成 HEARTRATE_PREVIEW（原生侧）' }

          # 千字节级：正常启动的日志是几 KB，1.8MB 那种是每帧刷栈
          $size = (Get-Item $log).Length
          Write-Host "startup.log size = $size bytes"
          if ($size -lt 1024) { throw "startup.log 太小（$size bytes），可能没跑到界面" }
          if ($size -gt 65536) { throw "startup.log 异常膨胀：$size bytes" }

          # 窗口层面 A：缩放命中。无边框窗口没有系统拖拽区，缩放全靠自己回
          # WM_NCHITTEST —— 直接给窗口发这条消息，断言四边四角与内部的返回值。
          # HTCLIENT=1 HTCAPTION=2 HTLEFT=10 HTRIGHT=11 HTTOP=12 HTTOPLEFT=13
          # HTTOPRIGHT=14 HTBOTTOM=15 HTBOTTOMLEFT=16 HTBOTTOMRIGHT=17
          $hwnd = [HrsWin]::Main([uint32]$proc.Id)
          if ($hwnd -eq [IntPtr]::Zero) { throw '找不到主窗口' }
          $style = [HrsWin]::GetWindowLong($hwnd, -16)
          if (($style -band 0x00040000) -eq 0) { throw '窗口没有 WS_THICKFRAME' }

          # 命中测试要打给 Flutter 视图（子窗口）——那才是真实输入路径。
          $target = [HrsWin]::FirstChild($hwnd)
          if ($target -eq [IntPtr]::Zero) { $target = $hwnd }
          Write-Host "hit-test target hwnd = $target (top = $hwnd)"

          function Hit-Test([IntPtr]$h, [int]$x, [int]$y) {
            $lp = [IntPtr](($y -shl 16) -bor ($x -band 0xFFFF))
            return ([HrsWin]::SendMessage($h, 0x0084, [IntPtr]::Zero, $lp)).ToInt32()
          }

          # Dart 上报的矩形（DIP）：拖动区 / 断开按钮。冒烟按同一份矩形去断言和点击。
          function Last-Rect([string]$text, [string]$name) {
            $m = [regex]::Matches($text, "dart: hit: $name rect (\d+)/(\d+)/(\d+)/(\d+)")
            if ($m.Count -eq 0) { return $null }
            $g = $m[$m.Count - 1].Groups
            return @([int]$g[1].Value, [int]$g[2].Value, [int]$g[3].Value, [int]$g[4].Value)
          }

          # 窗口层面 B：完整界面下 ①四边四角能缩放 ②上报的拖动区回 HTCAPTION
          # ③控件区（右上角胶囊、窗口中心）回 HTCLIENT —— 按钮必须能点。
          $windowOk = $false
          for ($i = 0; $i -lt 24; $i++) {
            $rect = New-Object HrsWin+RECT
            [void][HrsWin]::GetWindowRect($hwnd, [ref]$rect)
            $w = $rect.Right - $rect.Left
            $h = $rect.Bottom - $rect.Top
            if ($w -lt 700 -or $h -lt 450) { Start-Sleep -Milliseconds 500; continue }
            $drag = Last-Rect (Read-LogText $log) 'drag'
            if ($drag -eq $null) { Start-Sleep -Milliseconds 500; continue }

            $midX = [int](($rect.Left + $rect.Right) / 2)
            $midY = [int](($rect.Top + $rect.Bottom) / 2)
            $dragX = $rect.Left + $drag[0] + [int]($drag[2] / 2)
            $dragY = $rect.Top + $drag[1] + [int]($drag[3] / 2)
            $probe = @(
              @('left',         ($rect.Left + 3),  $midY,             10),
              @('right',        ($rect.Right - 4), $midY,             11),
              @('top',          $midX,             ($rect.Top + 3),   12),
              @('bottom',       $midX,             ($rect.Bottom - 4),15),
              @('topleft',      ($rect.Left + 3),  ($rect.Top + 3),   13),
              @('topright',     ($rect.Right - 4), ($rect.Top + 3),   14),
              @('bottomleft',   ($rect.Left + 3),  ($rect.Bottom - 4),16),
              @('bottomright',  ($rect.Right - 4), ($rect.Bottom - 4),17),
              @('center',       $midX,             $midY,             1),
              @('dragrect',     $dragX,            $dragY,            2),
              @('controls',     ($rect.Right - 24),($rect.Top + 46),  1)
            )
            $report = @()
            $allOk = $true
            foreach ($case in $probe) {
              $got = Hit-Test $target $case[1] $case[2]
              $report += "$($case[0])=$got"
              if ($got -ne $case[3]) { $allOk = $false }
            }
            Write-Host ("WM_NCHITTEST [${w}x${h}] drag=($($drag -join ',')): " + ($report -join ', '))
            if ($allOk) { $windowOk = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $windowOk) {
            throw 'WM_NCHITTEST 四边/四角/拖动区/控件区 返回值不对（窗口仍可能拉不动或按钮点不了）'
          }

          # 窗口层面 C：真的点一下精简态的「断开」——必须在 ~3 秒内回到完整界面，
          # 而不是等预览每 6 秒自动翻转。点不到就会拖到 6 秒那一拍，断言失败。
          $clicked = $false
          $deadline = (Get-Date).AddSeconds(40)
          while (-not $clicked -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
            $t = Read-LogText $log
            $inCompact = ([regex]::Matches($t, 'dart: ui_mode: full -> compact')).Count
            $backFull = ([regex]::Matches($t, 'dart: ui_mode: compact -> full')).Count
            if ($inCompact -le $backFull) { continue }
            $btn = Last-Rect $t 'disconnect'
            if ($btn -eq $null) { continue }
            $px = $btn[0] + [int]($btn[2] / 2)
            $py = $btn[1] + [int]($btn[3] / 2)
            $target = [HrsWin]::FirstChild($hwnd)
            if ($target -eq [IntPtr]::Zero) { $target = $hwnd }
            Write-Host "click 断开 at ($px,$py) of hwnd $target"
            $lp = [IntPtr](($py -shl 16) -bor ($px -band 0xFFFF))
            [void][HrsWin]::SendMessage($target, 0x0201, [IntPtr]1, $lp)  # WM_LBUTTONDOWN
            Start-Sleep -Milliseconds 120
            [void][HrsWin]::SendMessage($target, 0x0202, [IntPtr]0, $lp)  # WM_LBUTTONUP
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ($sw.Elapsed.TotalSeconds -lt 3) {
              Start-Sleep -Milliseconds 100
              $after = ([regex]::Matches((Read-LogText $log), 'dart: ui_mode: compact -> full')).Count
              if ($after -gt $backFull) {
                Write-Host ("click -> ui_mode: compact -> full in {0:N2}s" -f $sw.Elapsed.TotalSeconds)
                $clicked = $true
                break
              }
            }
            if (-not $clicked) { throw '点了「断开」3 秒内没有回到完整界面（点击没生效）' }
          }
          if (-not $clicked) { throw '没等到精简态，无法验证「断开」点击链路' }

          Get-Process -Id $proc.Id | Stop-Process -Force
          Write-Host 'preview smoke OK'
