# 直接用 Docker Hub 上的现成镜像部署 —— 不做本地构建。
#
# ★ 这是本仓库**唯一权威**的 compose 文件（生产就用它）。原根目录 docker-compose.yml
#   （本地 build）已删除：`docker compose up` 默认会挑到它，起一套本地构建，和"用 latest
#   部署"互相打架。要从源码本地构建请看 server/README.md 的 docker build/run 两条命令。
#
# 用法：
#   install -d -o 1000 -g 1000 -m 0750 ./logs     # 先给容器内 uid 1000 写权限
#   docker compose -f docker-compose-hub.yml up -d
#   docker compose -f docker-compose-hub.yml logs -f
#   docker compose -f docker-compose-hub.yml down
#
# 镜像仓库只保留 `latest` 一个 tag（历史版本 tag 已清理，见
# generated/relay/report-logs-latest.md）。每次发布覆盖同一个 tag：
#   要回滚就改回旧的 digest（IMAGE_DIGEST 形式见 README），不要再指望版本 tag。
#
# 升级：`docker compose -f docker-compose-hub.yml pull && up -d` —— pull_policy: always
#      会先拉新镜像，镜像变了 compose 会重建容器（内存房间状态会清空，客户端下一次
#      上报即自愈）。
#
# 日志：宿主机 ./logs/relay.log（可轮转，默认 10MB × 5 份）。首次部署先把目录给
#      容器内 uid 1000：mkdir -p ./logs && sudo chown -R 1000:1000 ./logs

services:
  relay:
    # 只发布 latest。要固定/回滚就覆盖 IMAGE 为**完整引用**（可以带 digest）：
    #   IMAGE=mawjgit/heart-rate-share@sha256:<digest> docker compose up -d
    image: ${IMAGE:-mawjgit/heart-rate-share:latest}
    container_name: heart-rate-relay
    restart: unless-stopped
    # 每次 up 都先尝试拉取最新镜像；钉了版本 tag 时等价于确认该 tag 是本地的。
    # 不用 build 段：这个文件刻意只拉取、不构建。
    pull_policy: always
    environment:
      # 容器内监听端口；同时决定宿主机映射端口，改一个地方即可。
      PORT: "${PORT:-8765}"
      ROOM_LIMIT: "${ROOM_LIMIT:-20}"
      OFFLINE_TIMEOUT_MS: "${OFFLINE_TIMEOUT_MS:-5000}"
      MAX_CLIENTS: "${MAX_CLIENTS:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # 日志落盘：容器内路径必须与 volumes 右侧一致；轮转参数见 server/README.md
      LOG_DIR: "${LOG_DIR:-/app/logs}"
      LOG_MAX_BYTES: "${LOG_MAX_BYTES:-20971520}"
      LOG_MAX_FILES: "${LOG_MAX_FILES:-5}"
      # 时区：日志时间戳按它输出（带偏移量），和手机上的本地时间对齐
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      # 日志目录挂到宿主机：容器重启不丢，docker 的 json-file 轮转也不再是唯一副本。
      #
      # 宿主目录必须让容器内 uid/gid **1000**（node 用户）可写，否则启动即 EACCES：
      #   install -d -o 1000 -g 1000 -m 0750 ./logs      # 推荐（一条命令定权限）
      #
      # 如果宿主机不方便改属主（比如 /srv 归 root、被其它策略管着），改用 named volume：
      #   volumes:
      #     - relay-logs:/app/logs
      #   volumes:   # 顶层
      #     relay-logs:
      # 之后用 `docker compose cp relay:/app/logs/relay.log ./` 或
      # `docker run --rm -v relay-logs:/logs alpine tar c -C /logs .` 取日志。
      - "${LOG_HOST_DIR:-./logs}:${LOG_DIR:-/app/logs}"
    ports:
      # 只绑 0.0.0.0 全接口；若前面有反向代理，建议改成 "127.0.0.1:${PORT:-8765}:${PORT:-8765}"
      - "${PORT:-8765}:${PORT:-8765}"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:'+process.env.PORT+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      # 日志轮转，避免长期运行把磁盘写满
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 无数据库：房间状态全在内存，重启即丢，客户端下一次上报即自愈。
    # 唯一需要持久化的是上面的日志目录（宿主机 ./logs）。
